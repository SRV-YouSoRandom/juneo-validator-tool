services:
  discord-bot:
    build: .
    container_name: juneo-discord-bot
    restart: unless-stopped
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - REPORT_CHANNEL_ID=${REPORT_CHANNEL_ID}
      - GUILD_ID=${GUILD_ID}
      - MONITORING_INTERVAL=${MONITORING_INTERVAL:-20}
    volumes:
      - bot_data:/app/data
      - bot_logs:/app/logs

volumes:
  bot_data:
    driver: local
  bot_logs:
    driver: local
